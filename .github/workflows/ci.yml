name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main

      # Must come before the check. Evaluating tolaria is
      # import-from-derivation (crane reads Cargo.lock/Cargo.toml out of the
      # fetched tree), and `--no-build` refuses to realise that source, so the
      # check cannot instantiate tolaria until the source is already in the
      # store. Fetching it costs one tarball.
      - run: nix build --no-link .#tolaria-src

      # Evaluate the outputs, but build nothing yet.
      #
      # Not --all-systems: the same import-from-derivation means evaluating
      # packages.aarch64-* would need an aarch64 source derivation realised on
      # an x86_64 runner. Other systems are covered by building there, not by
      # cross-evaluating here.
      - run: nix flake check --no-build

      # Build only what fits a hosted runner. `nix flake check` without
      # --no-build would also build .#tolaria, a Tauri/WebKitGTK app whose
      # Rust dependency closure exceeds the runner's disk. That one is
      # deliberately NOT covered here — build it locally, or move this job to
      # a self-hosted runner if it needs CI coverage.
      - run: nix build -L .#deplexity .#deplexity-with-chromium .#tolaria-mcp
